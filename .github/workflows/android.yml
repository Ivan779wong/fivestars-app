# 每次更新代码，GitHub 自动打包 Android APK，放到 Releases 页面给大家下载。
name: Build Android APK
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: write
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - name: Install Capacitor
        run: npm install
      - name: Create Android project
        run: |
          npx cap add android
          npx cap sync android
      - name: App icon
        run: |
          rm -rf android/app/src/main/res/mipmap-anydpi-v26
          cp -r resources/android/res/* android/app/src/main/res/
      - name: Use the team signing key (so updates install over the old app)
        run: |
          mkdir -p ~/.android
          cp android-debug.keystore ~/.android/debug.keystore
      - name: Build APK
        run: |
          cd android
          chmod +x gradlew
          ./gradlew assembleDebug
          cp app/build/outputs/apk/debug/app-debug.apk ../FiveStars-Daily.apk
      - uses: actions/upload-artifact@v4
        with:
          name: FiveStars-APK
          path: FiveStars-Daily.apk
      - name: Publish to Releases
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v1.0.${{ github.run_number }}
          name: 每日作战 v1.0.${{ github.run_number }}
          body: 下载下面的 APK，用安卓手机打开安装。iPhone 请用 Safari 打开 GitHub Pages 网址，再「加入主屏幕」。
          files: FiveStars-Daily.apk
          make_latest: true
